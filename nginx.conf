server {
    listen 8080;
    server_name _;
    root /srv/organized-research-agent-prototype;
    index index.html;

    # Static deck + shared SSI fragments. The local Node preview mirrors this
    # narrow include behavior for development; Nginx is not installed here.
    ssi on;
    ssi_types text/html;
    location /partials/ { internal; }

    location /api/ {
        proxy_pass http://127.0.0.1:4173/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
